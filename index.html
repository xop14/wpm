<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Speed Reader</title>
<style>
  :root {
    --bg: #f6f5f2; --panel: #ffffff; --text: #1d1d1f; --muted: #8a8a8e;
    --line: #dcdcdf; --pivot: #e0322b; --accent: #2a62d6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141416; --panel: #1e1e21; --text: #ececee; --muted: #8a8a8e;
      --line: #333338; --pivot: #ff5a4f; --accent: #6b9bff;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  main { max-width: 820px; margin: 0 auto; padding: 32px 16px; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 20px; }

  .reader {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 56px 0; position: relative; user-select: none;
  }
  /* guide ticks above and below the pivot column */
  .reader::before, .reader::after {
    content: ""; position: absolute; left: 50%; width: 2px; height: 14px;
    background: var(--line); transform: translateX(-1px);
  }
  .reader::before { top: 24px; }
  .reader::after { bottom: 24px; }
  .word {
    display: grid; grid-template-columns: 1fr auto 1fr;
    font: 500 clamp(32px, 7vw, 56px)/1.2 Georgia, "Times New Roman", serif;
    white-space: pre;
  }
  .word .l { text-align: right; }
  .word .p { color: var(--pivot); }
  .word .r { text-align: left; }

  .progress { height: 4px; background: var(--line); border-radius: 2px; margin: 16px 0 6px; overflow: hidden; }
  .progress div { height: 100%; width: 0; background: var(--accent); }
  .status { display: flex; justify-content: space-between; color: var(--muted); font-size: 13px; }

  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin: 20px 0; }
  button {
    font: inherit; padding: 8px 16px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--line); background: var(--panel); color: var(--text);
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; min-width: 90px; }
  .wpm { display: flex; align-items: center; gap: 10px; margin-left: auto; }
  .wpm input { width: 180px; }
  .wpm output { font-variant-numeric: tabular-nums; min-width: 72px; }

  textarea {
    width: 100%; min-height: 200px; padding: 12px; resize: vertical;
    font: inherit; color: var(--text); background: var(--panel);
    border: 1px solid var(--line); border-radius: 8px;
  }
  .hint { color: var(--muted); font-size: 13px; margin-top: 8px; }
  kbd { font: 12px ui-monospace, monospace; border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; }
</style>
</head>
<body>
<main>
  <h1>Speed Reader</h1>

  <div class="reader"><div class="word" id="word"><span class="l"></span><span class="p"></span><span class="r"></span></div></div>
  <div class="progress"><div id="bar"></div></div>
  <div class="status"><span id="pos">0 / 0</span><span id="remaining"></span></div>

  <div class="controls">
    <button class="primary" id="play">Play</button>
    <button id="back">« 10</button>
    <button id="restart">Restart</button>
    <label class="wpm">WPM
      <input type="range" id="speed" min="100" max="1000" step="25" value="300">
      <output id="speedVal">300</output>
    </label>
  </div>

  <textarea id="text" placeholder="Paste text here…"></textarea>
  <div class="hint">
    <kbd>Space</kbd> play/pause · <kbd>←</kbd> <kbd>→</kbd> step word · <kbd>↑</kbd> <kbd>↓</kbd> speed ±25
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
const [leftEl, pivotEl, rightEl] = $('word').children;

let words = [];   // { text, pause } — pause is a multiplier on the base delay
let i = 0;
let timer = null;
let wpm = 300;

try { wpm = +localStorage.getItem('wpm') || 300; } catch {}
$('speed').value = wpm;
$('speedVal').textContent = wpm;

$('text').value = "Rapid serial visual presentation shows you one word at a time in a fixed spot. " +
  "The red letter is the optimal recognition point, where your eye naturally lands. " +
  "Because your eyes never have to move, you can read much faster than usual.\n\n" +
  "Paste your own text here, pick a speed, and press play.";

// Spritz-style pivot position: roughly a third of the way in, capped.
function pivotIndex(len) {
  if (len <= 1) return 0;
  if (len <= 5) return 1;
  if (len <= 9) return 2;
  if (len <= 13) return 3;
  return 4;
}

function parse(text) {
  const out = [];
  for (const para of text.split(/\n\s*\n/)) {
    const tokens = para.split(/\s+/).filter(Boolean);
    tokens.forEach(t => {
      let pause = 1;
      if (/[.!?]["')\]]*$/.test(t)) pause = 2.2;
      else if (/[,;:–—]["')\]]*$/.test(t)) pause = 1.5;
      if (t.length > 8) pause += 0.3;
      out.push({ text: t, pause });
    });
    if (out.length) out[out.length - 1].pause += 1.5; // paragraph break
  }
  return out;
}

function show(w) {
  if (!w) { leftEl.textContent = pivotEl.textContent = rightEl.textContent = ''; return; }
  // Ignore leading punctuation like quotes/brackets when picking the pivot letter.
  const lead = w.text.match(/^[^\p{L}\p{N}]*/u)[0].length;
  const core = w.text.slice(lead).replace(/[^\p{L}\p{N}]+$/u, '');
  const p = lead + pivotIndex(core.length || w.text.length);
  const at = Math.min(p, w.text.length - 1);
  leftEl.textContent = w.text.slice(0, at);
  pivotEl.textContent = w.text[at];
  rightEl.textContent = w.text.slice(at + 1);
}

function render() {
  show(words[i]);
  const n = words.length;
  $('pos').textContent = `${Math.min(i + 1, n)} / ${n}`;
  $('bar').style.width = n ? `${(i + 1) / n * 100}%` : '0';
  const secs = Math.round((n - i - 1) * 60 / wpm);
  $('remaining').textContent = n ? `${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, '0')} left` : '';
}

function tick() {
  render();
  const delay = 60000 / wpm * words[i].pause;
  timer = setTimeout(() => {
    if (i < words.length - 1) { i++; tick(); }
    else pause();
  }, delay);
}

function play() {
  if (!words.length) load();
  if (!words.length) return;
  if (i >= words.length - 1) i = 0;
  $('play').textContent = 'Pause';
  tick();
}

function pause() {
  clearTimeout(timer);
  timer = null;
  $('play').textContent = 'Play';
}

function load() {
  pause();
  words = parse($('text').value);
  i = 0;
  render();
}

function step(d) {
  pause();
  i = Math.max(0, Math.min(words.length - 1, i + d));
  render();
}

function setSpeed(v) {
  wpm = Math.max(100, Math.min(1000, v));
  $('speed').value = wpm;
  $('speedVal').textContent = wpm;
  try { localStorage.setItem('wpm', wpm); } catch {}
  render();
}

$('play').onclick = () => timer ? pause() : play();
$('back').onclick = () => step(-10);
$('restart').onclick = load;
$('speed').oninput = e => setSpeed(+e.target.value);
$('text').oninput = load;

document.addEventListener('keydown', e => {
  if (e.target === $('text')) return;
  if (e.code === 'Space') { e.preventDefault(); timer ? pause() : play(); }
  else if (e.key === 'ArrowLeft') step(-1);
  else if (e.key === 'ArrowRight') step(1);
  else if (e.key === 'ArrowUp') { e.preventDefault(); setSpeed(wpm + 25); }
  else if (e.key === 'ArrowDown') { e.preventDefault(); setSpeed(wpm - 25); }
});

load();
</script>
</body>
</html>
