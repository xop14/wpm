<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WPM | Speed Reader</title>
<script>
  // Apply a saved theme before first paint to avoid a flash.
  try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch {}
</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header>
    <h1>WPM <span class="bar">|</span> Speed Reader</h1>
    <div class="header-actions">
      <button class="icon" id="theme" aria-label="Toggle dark mode" title="Toggle dark mode"></button>
      <button class="icon" id="openSettings" aria-label="Settings" title="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
  </header>

  <div class="reader"><div class="word" id="word"><span class="l"></span><span class="p"></span><span class="r"></span></div></div>
  <div class="progress"><div id="bar"></div></div>
  <div class="status"><span id="pos">0 / 0</span><span id="remaining"></span></div>

  <div class="controls card">
    <div class="buttons">
      <button class="primary" id="play">Play</button>
      <button id="back" aria-label="Sentence" title="Sentence">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="19 20 9 12 19 4 19 20" fill="currentColor"/><line x1="5" y1="19" x2="5" y2="5"/></svg>
        <span class="label">Sentence</span>
      </button>
      <button id="restart" aria-label="Restart" title="Restart">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
        <span class="label">Restart</span>
      </button>
    </div>
    <label class="wpm">WPM
      <input type="range" id="speed" min="100" max="1000" step="25" value="300">
      <output id="speedVal">300</output>
    </label>
  </div>

  <dialog id="settings">
    <div class="inner">
      <div class="head">
        <h2>Settings</h2>
        <button class="icon" id="closeSettings" aria-label="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <label class="opt"><input type="checkbox" id="sentence" checked> Stop at sentence end</label>
    </div>
  </dialog>

  <div class="card">
    <div class="text-actions">
      <button id="paste">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/></svg>
        Paste
      </button>
      <button id="clear">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        Clear
      </button>
    </div>
    <div class="text-wrap">
      <div class="backdrop" id="backdrop"></div>
      <textarea id="text" placeholder="Paste text here…"></textarea>
    </div>
  </div>
  <div class="hint">
    <kbd>Space</kbd> play/pause · <kbd>←</kbd> <kbd>→</kbd> step word · <kbd>Shift</kbd>+<kbd>←</kbd> <kbd>→</kbd> step sentence · <kbd>↑</kbd> <kbd>↓</kbd> speed ±25
  </div>
</main>

<script src="app.js"></script>
</body>
</html>
