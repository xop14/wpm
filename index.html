<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WPM | Speed Reader</title>
<script>
  // Apply a saved theme before first paint to avoid a flash.
  try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch {}
</script>
<style>
  :root {
    --bg: #f6f5f2; --panel: #ffffff; --text: #1d1d1f; --muted: #8a8a8e;
    --line: #dcdcdf; --pivot: #e0322b; --accent: #c62f28; --hl: #e6e6e9;
    color-scheme: light;
  }
  /* Dark follows the system unless the toggle has picked a theme (data-theme on <html>). */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141416; --panel: #1e1e21; --text: #ececee; --muted: #8a8a8e;
      --line: #333338; --pivot: #ff5a4f; --accent: #c93a32; --hl: #36363c;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #141416; --panel: #1e1e21; --text: #ececee; --muted: #8a8a8e;
    --line: #333338; --pivot: #ff5a4f; --accent: #c93a32; --hl: #36363c;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  main { max-width: 820px; margin: 0 auto; padding: 32px 16px; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 20px; }

  .reader {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 56px 0; position: relative; user-select: none;
  }
  /* guide ticks above and below the pivot column */
  .reader::before, .reader::after {
    content: ""; position: absolute; left: 50%; width: 2px; height: 14px;
    background: var(--line); transform: translateX(-1px);
  }
  .reader::before { top: 24px; }
  .reader::after { bottom: 24px; }
  .word {
    display: grid; grid-template-columns: 1fr auto 1fr;
    font: 500 clamp(32px, 7vw, 56px)/1.2 Georgia, "Times New Roman", serif;
    white-space: pre;
  }
  .word .l { text-align: right; }
  .word .p { color: var(--pivot); }
  .word .r { text-align: left; }

  .progress { height: 4px; background: var(--line); border-radius: 2px; margin: 16px 0 6px; overflow: hidden; }
  .progress div { height: 100%; width: 0; background: var(--accent); }
  .status { display: flex; justify-content: space-between; color: var(--muted); font-size: 13px; }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin: 20px 0; }
  button {
    font: inherit; padding: 8px 16px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--line); background: var(--panel); color: var(--text);
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  }
  button svg { width: 16px; height: 16px; flex: none; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; min-width: 136px; }
  input { accent-color: var(--accent); } /* slider and checkbox */
  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  header h1 { margin: 0; }
  header h1 .bar { color: var(--pivot); }
  .header-actions { display: flex; gap: 4px; }
  .icon { padding: 6px; border: none; background: none; color: var(--muted); line-height: 0; }
  .icon:hover { color: var(--text); }
  .icon svg { width: 22px; height: 22px; }

  dialog {
    padding: 0; width: min(360px, calc(100% - 32px));
    background: var(--panel); color: var(--text);
    border: 1px solid var(--line); border-radius: 12px;
  }
  dialog::backdrop { background: rgba(0, 0, 0, 0.4); }
  dialog .inner { padding: 16px 20px 20px; }
  dialog .head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  dialog h2 { font-size: 17px; margin: 0; }
  .opt { display: flex; align-items: center; gap: 10px; cursor: pointer; }
  /* Custom checkbox: rounded box with a smaller tick inset from the edges. */
  .opt input {
    appearance: none; flex: none; width: 22px; height: 22px; margin: 0; cursor: pointer;
    display: grid; place-content: center;
    border: 2px solid var(--muted); border-radius: 7px; background: var(--panel);
  }
  .opt input:checked { background: var(--accent); border-color: var(--accent); }
  .opt input:checked::after {
    content: ""; width: 5px; height: 10px; border: solid #fff; border-width: 0 2px 2px 0;
    transform: translateY(-1px) rotate(45deg);
  }
  .opt input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .wpm { display: flex; align-items: center; gap: 10px; margin-left: auto; }
  .wpm input { width: 180px; }
  .wpm output { font-variant-numeric: tabular-nums; min-width: 72px; }

  .text-actions { display: flex; justify-content: flex-end; gap: 8px; margin-bottom: 8px; }
  .text-actions button { padding: 4px 12px; font-size: 14px; }
  /* The textarea is transparent over a backdrop that mirrors its text, so the current word can be highlighted. */
  .text-wrap { position: relative; background: var(--panel); border-radius: 8px; }
  textarea, .backdrop {
    font: inherit; padding: 12px; border: 1px solid transparent; border-radius: 8px;
    white-space: pre-wrap; overflow-wrap: break-word; scrollbar-gutter: stable;
  }
  textarea {
    position: relative; display: block; width: 100%; min-height: 200px; resize: vertical;
    color: var(--text); background: transparent; border-color: var(--line);
  }
  .backdrop { position: absolute; inset: 0; overflow: hidden; color: transparent; }
  .backdrop mark { background: var(--hl); color: transparent; border-radius: 3px; }
  .hint { color: var(--muted); font-size: 13px; margin-top: 8px; }
  kbd { font: 12px ui-monospace, monospace; border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>WPM <span class="bar">|</span> Speed Reader</h1>
    <div class="header-actions">
      <button class="icon" id="theme" aria-label="Toggle dark mode" title="Toggle dark mode"></button>
      <button class="icon" id="openSettings" aria-label="Settings" title="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
  </header>

  <div class="reader"><div class="word" id="word"><span class="l"></span><span class="p"></span><span class="r"></span></div></div>
  <div class="progress"><div id="bar"></div></div>
  <div class="status"><span id="pos">0 / 0</span><span id="remaining"></span></div>

  <div class="controls card">
    <button class="primary" id="play">Play</button>
    <button id="back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="19 20 9 12 19 4 19 20" fill="currentColor"/><line x1="5" y1="19" x2="5" y2="5"/></svg>
      Sentence
    </button>
    <button id="restart">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
      Restart
    </button>
    <label class="wpm">WPM
      <input type="range" id="speed" min="100" max="1000" step="25" value="300">
      <output id="speedVal">300</output>
    </label>
  </div>

  <dialog id="settings">
    <div class="inner">
      <div class="head">
        <h2>Settings</h2>
        <button class="icon" id="closeSettings" aria-label="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <label class="opt"><input type="checkbox" id="sentence" checked> Stop at sentence end</label>
    </div>
  </dialog>

  <div class="card">
    <div class="text-actions">
      <button id="paste">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/></svg>
        Paste
      </button>
      <button id="clear">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        Clear
      </button>
    </div>
    <div class="text-wrap">
      <div class="backdrop" id="backdrop"></div>
      <textarea id="text" placeholder="Paste text here…"></textarea>
    </div>
  </div>
  <div class="hint">
    <kbd>Space</kbd> play/pause · <kbd>←</kbd> <kbd>→</kbd> step word · <kbd>Shift</kbd>+<kbd>←</kbd> <kbd>→</kbd> step sentence · <kbd>↑</kbd> <kbd>↓</kbd> speed ±25
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
const [leftEl, pivotEl, rightEl] = $('word').children;

const svg = inner => `<svg viewBox="0 0 24 24" fill="currentColor" stroke="none">${inner}</svg>`;
const ICONS = {
  play: svg('<polygon points="6 3 20 12 6 21 6 3"/>'),
  pause: svg('<rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/>'),
};
const setPlayButton = (icon, label) => $('play').innerHTML = ICONS[icon] + label;

const strokeSvg = inner => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;
const SUN = strokeSvg('<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>');
const MOON = strokeSvg('<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>');
const systemDark = matchMedia('(prefers-color-scheme: dark)');
const isDark = () => (document.documentElement.dataset.theme || (systemDark.matches ? 'dark' : 'light')) === 'dark';
// Show the sun in dark mode (click for light) and the moon in light mode.
const updateThemeIcon = () => $('theme').innerHTML = isDark() ? SUN : MOON;
updateThemeIcon();
systemDark.onchange = updateThemeIcon;
$('theme').onclick = () => {
  const t = isDark() ? 'light' : 'dark';
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem('theme', t); } catch {}
  updateThemeIcon();
};

let words = [];   // { text, pause, end, start, stop } — pause is a multiplier on the base delay; end marks a sentence end;
                  // start/stop are character offsets in the text box
let i = 0;
let timer = null;
let wpm = 300;
let stopping = false;    // pause requested; waiting for the sentence to finish
let resumeNext = false;  // stopped on a sentence end, so resume from the next word
let playing = false;     // the text box highlight is hidden while playing
let smoothScroll = false; // jump straight to the saved word on page load, then scroll smoothly

try { wpm = +localStorage.getItem('wpm') || 300; } catch {}
try { $('sentence').checked = localStorage.getItem('sentenceStop') !== '0'; } catch {}
$('speed').value = wpm;
$('speedVal').textContent = wpm;

const sample = "Rapid serial visual presentation shows you one word at a time in a fixed spot. " +
  "The red letter is the optimal recognition point, where your eye naturally lands. " +
  "Because your eyes never have to move, you can read much faster than usual.\n\n" +
  "Paste your own text here, pick a speed, and press play.";
let saved = null;
try { saved = localStorage.getItem('text'); } catch {}
$('text').value = saved ?? sample;

// Spritz-style pivot position: roughly a third of the way in, capped.
function pivotIndex(len) {
  if (len <= 1) return 0;
  if (len <= 5) return 1;
  if (len <= 9) return 2;
  if (len <= 13) return 3;
  return 4;
}

function parse(text) {
  const out = [];
  const paraEnd = w => { w.pause += 1.5; w.end = true; };
  for (const m of text.matchAll(/\S+/g)) {
    const t = m[0];
    const prev = out[out.length - 1];
    if (prev && /\n\s*\n/.test(text.slice(prev.stop, m.index))) paraEnd(prev);
    let pause = 1, end = false;
    if (/[.!?]["')\]]*$/.test(t)) { pause = 2.2; end = true; }
    else if (/[,;:–—]["')\]]*$/.test(t)) pause = 1.5;
    if (t.length > 8) pause += 0.3;
    out.push({ text: t, pause, end, start: m.index, stop: m.index + t.length });
  }
  if (out.length) paraEnd(out[out.length - 1]);
  return out;
}

const escapeHTML = s => s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c]);

// Mirror the textarea text in the backdrop behind it, with the current word wrapped in <mark>.
// Shown only while stopped; the backdrop is emptied otherwise.
function highlight(on) {
  const w = on && words[i], ta = $('text'), bd = $('backdrop');
  if (!w) { bd.textContent = ''; return; }
  const text = ta.value;
  bd.innerHTML = escapeHTML(text.slice(0, w.start)) + '<mark>' + escapeHTML(w.text) + '</mark>' +
    escapeHTML(text.slice(w.stop)).replace(/\n$/, '\n\n'); // keep a trailing newline's line height
  bd.scrollTop = ta.scrollTop;
  // Keep the word in view, unless the user is typing in the box.
  const m = bd.querySelector('mark');
  if (m && document.activeElement !== ta &&
      (m.offsetTop < ta.scrollTop || m.offsetTop + m.offsetHeight > ta.scrollTop + ta.clientHeight)) {
    ta.scrollTo({ top: m.offsetTop - ta.clientHeight / 3, behavior: smoothScroll ? 'smooth' : 'instant' });
  }
}

function show(w) {
  if (!w) { leftEl.textContent = pivotEl.textContent = rightEl.textContent = ''; return; }
  // Ignore leading punctuation like quotes/brackets when picking the pivot letter.
  const lead = w.text.match(/^[^\p{L}\p{N}]*/u)[0].length;
  const core = w.text.slice(lead).replace(/[^\p{L}\p{N}]+$/u, '');
  const p = lead + pivotIndex(core.length || w.text.length);
  const at = Math.min(p, w.text.length - 1);
  leftEl.textContent = w.text.slice(0, at);
  pivotEl.textContent = w.text[at];
  rightEl.textContent = w.text.slice(at + 1);
}

function render() {
  show(words[i]);
  highlight(!playing);
  const n = words.length;
  $('pos').textContent = `${Math.min(i + 1, n)} / ${n}`;
  $('bar').style.width = n ? `${(i + 1) / n * 100}%` : '0';
  const secs = Math.round((n - i - 1) * 60 / wpm);
  $('remaining').textContent = n ? `${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, '0')} left` : '';
  try { localStorage.setItem('pos', i); } catch {}
}

function tick() {
  render();
  if (stopping && words[i].end) { pause(); resumeNext = true; return; }
  const delay = 60000 / wpm * words[i].pause;
  timer = setTimeout(() => {
    if (i < words.length - 1) { i++; tick(); }
    else pause();
  }, delay);
}

function play() {
  if (!words.length) load();
  if (!words.length) return;
  if (resumeNext) i++;
  if (i >= words.length - 1) i = 0;
  setPlayButton('pause', 'Pause');
  playing = true;
  tick();
}

function pause() {
  clearTimeout(timer);
  timer = null;
  stopping = resumeNext = playing = false;
  setPlayButton('play', 'Play');
  highlight(true);
}

// Pause from the play button or Space: optionally let the current sentence finish first.
// Pressing again while finishing stops immediately.
function stop() {
  if (!$('sentence').checked || stopping) return pause();
  if (words[i].end) { pause(); resumeNext = true; return; }
  stopping = true;
  setPlayButton('pause', 'Finishing…');
}

function load() {
  pause();
  words = parse($('text').value);
  i = 0;
  render();
}

function step(d) {
  pause();
  i = Math.max(0, Math.min(words.length - 1, i + d));
  render();
}

// Jump to the start of the current sentence, or the previous one if already at a start.
function backSentence() {
  const startOf = j => { while (j > 0 && !words[j - 1].end) j--; return j; };
  let s = startOf(i);
  if (s === i) s = startOf(Math.max(0, i - 1));
  pause();
  i = s;
  render();
}

// Jump to the start of the next sentence (or the last word if there isn't one).
function forwardSentence() {
  let j = i + 1;
  while (j < words.length && !words[j - 1].end) j++;
  pause();
  i = Math.min(j, words.length - 1);
  render();
}

function setSpeed(v) {
  wpm = Math.max(100, Math.min(1000, v));
  $('speed').value = wpm;
  $('speedVal').textContent = wpm;
  try { localStorage.setItem('wpm', wpm); } catch {}
  render();
}

$('play').onclick = () => timer ? stop() : play();
$('openSettings').onclick = () => { pause(); $('settings').showModal(); };
$('closeSettings').onclick = () => $('settings').close();
$('settings').onclick = e => { if (e.target === $('settings')) $('settings').close(); }; // backdrop click
$('sentence').onchange = e => { try { localStorage.setItem('sentenceStop', e.target.checked ? '1' : '0'); } catch {} };
$('back').onclick = backSentence;
$('restart').onclick = load;
$('speed').oninput = e => setSpeed(+e.target.value);
function saveText() {
  try { localStorage.setItem('text', $('text').value); } catch {}
  load();
}
$('text').oninput = saveText;
$('text').onscroll = () => $('backdrop').scrollTop = $('text').scrollTop;
$('paste').onclick = async () => {
  try { $('text').value = await navigator.clipboard.readText(); }
  catch { alert('Could not read the clipboard. Paste into the box with ⌘V instead.'); return; }
  saveText();
};
$('clear').onclick = () => { $('text').value = ''; saveText(); $('text').focus(); };

document.addEventListener('keydown', e => {
  if (e.target === $('text') || $('settings').open) return;
  if (e.code === 'Space') { e.preventDefault(); timer ? stop() : play(); }
  else if (e.key === 'ArrowLeft') e.shiftKey ? backSentence() : step(-1);
  else if (e.key === 'ArrowRight') e.shiftKey ? forwardSentence() : step(1);
  else if (e.key === 'ArrowUp') { e.preventDefault(); setSpeed(wpm + 25); }
  else if (e.key === 'ArrowDown') { e.preventDefault(); setSpeed(wpm - 25); }
});

// Read the saved position before load(), which resets it to 0.
let savedPos = 0;
try { savedPos = +localStorage.getItem('pos') || 0; } catch {}
load();
i = Math.min(savedPos, Math.max(words.length - 1, 0));
render();
smoothScroll = true;
</script>
</body>
</html>
